<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TalkingSh*rt — Order confirmed</title>
    <!-- pin: 6989e79 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/EasySimpleCool/talkingshirt-tokens@6989e7981a44a6f747d5c7f76d439aa85399cc93/dist/index.css"
    />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div class="header header--fixed" data-section="md" data-type="home" role="banner">
      <div data-container>
        <div data-row data-justify="between">
          <a class="logo" href="/" aria-label="TalkingSh*rt home">
            <span class="logo__img" aria-hidden="true"></span>
          </a>
          <a class="header__about" href="/" aria-label="About">
            <span class="icon-text" data-row data-gap="2xs">
              <span class="icon-text__label type-small">About</span>
              <span class="icon-text__icon icon-text__icon--ball" aria-hidden="true"></span>
            </span>
          </a>
        </div>
      </div>
    </div>

    <main>
      <section class="success-main" data-section="lg">
        <div data-container>
          <div data-stack>
            <div class="post" data-stack>
              <div class="post-head" data-row data-justify="between">
                <span class="post-label type-small">Order confirmed</span>
                <time class="post-date type-small" datetime="2026-04-02">
                  2/04/26
                </time>
              </div>
              <p class="post-body type-medium" id="successMessage">
                Thanks for ordering, your sh*rt is on the way.
              </p>
              <div class="post-divider" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      const sessionId = new URLSearchParams(window.location.search).get(
        "session_id",
      );
      if (sessionId) {
        fetch(
          `/.netlify/functions/order-summary?session_id=${encodeURIComponent(sessionId)}`,
        )
          .then((res) => (res.ok ? res.json() : null))
          .then((data) => {
            if (data?.fulfillment === "pickup") {
              document.getElementById("successMessage").textContent =
                "Thanks for ordering — I'll message you soon to sort a time and place nearby to hand it over.";
            }
          })
          .catch(() => {
            // Leave the default delivery message in place on any failure.
          });
      }
    </script>
  </body>
</html>
