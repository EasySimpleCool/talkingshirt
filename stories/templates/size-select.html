<label class="size-select">
  <!-- Text intentionally empty: the visible label is drawn by the
       .size-select-text::before rule in size-select.css, which mirrors the
       currently-selected option via :has(option:checked). -->
  <span class="size-select-text type-medium" aria-hidden="true"></span>
  <select class="size-select-native" name="size" aria-label="Size">
    <option value="Small">Small</option>
    <option value="Medium">Medium</option>
    <option value="Large" selected>Large</option>
    <option value="XLarge">XLarge</option>
    <option value="XXLarge">XXLarge</option>
  </select>
</label>
